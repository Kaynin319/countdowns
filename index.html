<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Countdown Home Page</title>
        <style>
            :root {
                --bg: #0b0b0d;
                --panel: #17171b;
                --panel-alt: #1d1d22;
                --header-bg: #1a1a1f;
                --border: rgba(255, 255, 255, 0.07);
                --text: #e6e6ea;
                --muted: #86868f;
                --accent: #12a893;
                --accent-dim: rgba(18, 168, 147, 0.25);
                --row-hover: #232329;
                --shadow: rgba(0, 0, 0, 0.55);
                --radius-lg: 14px;
                --radius-sm: 6px;

                --desktop-scale: 1.15;

                --page-max: 1700px;
                --page-pad: 24px;
                --col-gap: 22px;
                --group-gap: 20px;

                /* overridden at runtime from links.json settings */
                --icon-size: 24px;
                --font-size: 13.5px;
            }

            html, body {
                height: 100%;
            }

            body {
                margin: 0;
                font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
                background: var(--bg);
                color: var(--text);
            }

            @media (min-width: 1024px) {
                html { zoom: var(--desktop-scale); }
                @supports not (zoom: 1) {
                    body {
                        transform: scale(var(--desktop-scale));
                        transform-origin: top center;
                        width: calc(100% / var(--desktop-scale));
                        overflow-x: hidden;
                    }
                }
            }

            .toolbar {
                display: flex;
                align-items: center;
                gap: 12px;
                max-width: var(--page-max);
                margin: 0 auto;
                padding: 16px var(--page-pad) 4px var(--page-pad);
            }

            .search {
                flex: 1;
                display: flex;
                align-items: center;
                gap: 8px;
                background: var(--panel);
                border: 1px solid var(--border);
                border-radius: 999px;
                padding: 10px 14px;
                box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.02);
            }

            .search input {
                flex: 1;
                background: transparent;
                color: var(--text);
                border: 0;
                outline: none;
                font-size: 14px;
            }

            .settings-btn {
                width: 38px;
                height: 38px;
                flex-shrink: 0;
                display: grid;
                place-items: center;
                background: var(--panel);
                border: 1px solid var(--border);
                border-radius: 999px;
                cursor: pointer;
                color: var(--muted);
            }

            .settings-btn:hover {
                color: var(--text);
                border-color: var(--accent-dim);
            }

            .settings-panel {
                display: none;
                max-width: var(--page-max);
                margin: 0 auto;
                padding: 12px var(--page-pad) 0 var(--page-pad);
            }

            .settings-panel.open {
                display: block;
            }

            .settings-card {
                background: var(--panel);
                border: 1px solid var(--border);
                border-radius: var(--radius-lg);
                padding: 16px 18px;
                display: flex;
                gap: 28px;
                flex-wrap: wrap;
                box-shadow: 0 6px 18px var(--shadow);
            }

            .settings-field {
                display: flex;
                flex-direction: column;
                gap: 6px;
                min-width: 200px;
            }

            .settings-field label {
                font-size: 12px;
                color: var(--muted);
            }

            .settings-field-row {
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .settings-field input[type="range"] {
                flex: 1;
                accent-color: var(--accent);
            }

            .settings-field .value {
                font-size: 12px;
                color: var(--text);
                min-width: 44px;
                text-align: right;
            }

            .container {
                max-width: var(--page-max);
                margin: 0 auto;
                padding: var(--page-pad);
                display: grid;
                gap: var(--col-gap);
                align-items: start;
            }

            @media (max-width: 900px) {
                .container {
                    grid-template-columns: 1fr !important;
                }
            }

            .column {
                display: flex;
                flex-direction: column;
                gap: var(--group-gap);
            }

            .group {
                background: var(--panel);
                border: 1px solid var(--border);
                border-radius: var(--radius-lg);
                box-shadow: 0 6px 18px var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.02);
                overflow: hidden;
            }

            .group-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 10px 16px;
                background: var(--header-bg);
                border-bottom: 1px solid var(--border);
            }

            .group-title {
                font-size: 14px;
                font-weight: 700;
                letter-spacing: 0.3px;
                color: var(--text);
            }

            .group-count {
                font-size: 11px;
                color: var(--muted);
                background: rgba(0, 0, 0, 0.3);
                padding: 3px 8px;
                border-radius: 999px;
                border: 1px solid var(--border);
            }

            .group-body {
                display: flex;
                flex-direction: column;
            }

            .link-row {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 9px 16px;
                text-decoration: none;
                color: inherit;
                border-bottom: 1px solid var(--border);
                transition: background 100ms ease;
            }

            .link-row:last-child {
                border-bottom: none;
            }

            .link-row:hover, .link-row:focus-visible {
                background: var(--row-hover);
            }

            .link-icon-wrap {
                width: var(--icon-size);
                height: var(--icon-size);
                flex-shrink: 0;
                border-radius: var(--radius-sm);
                background: var(--panel-alt);
                display: grid;
                place-items: center;
                overflow: hidden;
                position: relative;
            }

            .link-icon {
                width: 100%;
                height: 100%;
                object-fit: contain;
            }

            .link-icon-fallback {
                position: absolute;
                inset: 0;
                display: grid;
                place-items: center;
                font-weight: 800;
                font-size: 11px;
                color: var(--accent);
                background: var(--panel-alt);
            }

            .link-name {
                font-size: var(--font-size);
                color: var(--text);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .load-error {
                padding: 16px;
                background: var(--panel);
                border-radius: 12px;
                border: 1px solid var(--border);
                color: var(--muted);
            }
        </style>
    </head>
    <body>
        <div class="toolbar">
            <div class="search">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M21 21l-4.35-4.35M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15z" stroke="#86868f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
                <input id="searchInput" type="text" placeholder="Filter links..." />
            </div>
            <button class="settings-btn" id="settingsBtn" aria-label="Settings" title="Settings">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" stroke="currentColor" stroke-width="1.7"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" stroke="currentColor" stroke-width="1.7"/>
                </svg>
            </button>
        </div>

        <div class="settings-panel" id="settingsPanel">
            <div class="settings-card">
                <div class="settings-field">
                    <label for="iconSizeRange">Icon Size (px)</label>
                    <div class="settings-field-row">
                        <input type="range" id="iconSizeRange" min="12" max="64" step="1" />
                        <span class="value" id="iconSizeValue"></span>
                    </div>
                </div>
                <div class="settings-field">
                    <label for="fontSizeRange">Text Font Size (px)</label>
                    <div class="settings-field-row">
                        <input type="range" id="fontSizeRange" min="8" max="28" step="0.5" />
                        <span class="value" id="fontSizeValue"></span>
                    </div>
                </div>
            </div>
        </div>

        <main class="container" id="container" aria-live="polite" aria-busy="true"></main>

        <template id="groupTemplate">
            <section class="group">
                <header class="group-header">
                    <div class="group-title"></div>
                    <div class="group-count" aria-label="Item count"></div>
                </header>
                <div class="group-body"></div>
            </section>
        </template>

        <template id="linkTemplate">
            <a class="link-row" target="_blank" rel="noopener noreferrer">
                <div class="link-icon-wrap">
                    <img class="link-icon" alt="" />
                    <div class="link-icon-fallback" aria-hidden="true"></div>
                </div>
                <span class="link-name"></span>
            </a>
        </template>

        <script>
            const JSON_URL = "./links.json";
            const MEDIA_BASE = "./media/";

            const container = document.getElementById("container");
            const groupTemplate = document.getElementById("groupTemplate");
            const linkTemplate = document.getElementById("linkTemplate");
            const searchInput = document.getElementById("searchInput");

            const settingsBtn = document.getElementById("settingsBtn");
            const settingsPanel = document.getElementById("settingsPanel");
            const iconSizeRange = document.getElementById("iconSizeRange");
            const iconSizeValue = document.getElementById("iconSizeValue");
            const fontSizeRange = document.getElementById("fontSizeRange");
            const fontSizeValue = document.getElementById("fontSizeValue");

            const root = document.documentElement;

            function applySettings(iconSize, fontSize) {
                root.style.setProperty("--icon-size", iconSize + "px");
                root.style.setProperty("--font-size", fontSize + "px");
                iconSizeRange.value = iconSize;
                fontSizeRange.value = fontSize;
                iconSizeValue.textContent = iconSize + "px";
                fontSizeValue.textContent = fontSize + "px";
            }

            settingsBtn.addEventListener("click", () => {
                settingsPanel.classList.toggle("open");
            });

            iconSizeRange.addEventListener("input", (e) => {
                const v = e.target.value;
                root.style.setProperty("--icon-size", v + "px");
                iconSizeValue.textContent = v + "px";
            });

            fontSizeRange.addEventListener("input", (e) => {
                const v = e.target.value;
                root.style.setProperty("--font-size", v + "px");
                fontSizeValue.textContent = v + "px";
            });

            function createLinkRow(item) {
                const node = linkTemplate.content.firstElementChild.cloneNode(true);
                const img = node.querySelector(".link-icon");
                const fallback = node.querySelector(".link-icon-fallback");
                const name = node.querySelector(".link-name");

                node.href = item.url;
                node.setAttribute("aria-label", item.name);
                name.textContent = item.name;
                fallback.textContent = (item.name || "?").trim().charAt(0).toUpperCase();

                let iconSrc = null;
                if (item.icon && typeof item.icon === "string") {
                    iconSrc = MEDIA_BASE + item.icon;
                }

                if (iconSrc) {
                    img.src = iconSrc;
                    img.addEventListener("load", () => {
                        img.style.display = "block";
                        fallback.style.display = "none";
                    });
                    img.addEventListener("error", () => {
                        img.removeAttribute("src");
                        img.style.display = "none";
                        fallback.style.display = "grid";
                    });
                } else {
                    img.style.display = "none";
                    fallback.style.display = "grid";
                }

                return node;
            }

            function createGroup(title, items) {
                const node = groupTemplate.content.firstElementChild.cloneNode(true);
                node.querySelector(".group-title").textContent = title;
                node.querySelector(".group-count").textContent = items.length + (items.length === 1 ? " item" : " items");

                const body = node.querySelector(".group-body");
                items.forEach(item => body.appendChild(createLinkRow(item)));

                return node;
            }

            function filterUI(query) {
                const q = query.trim().toLowerCase();
                const groups = Array.from(container.querySelectorAll(".group"));
                let anyVisible = false;

                groups.forEach(group => {
                    const title = group.querySelector(".group-title").textContent.toLowerCase();
                    const rows = Array.from(group.querySelectorAll(".link-row"));
                    let visibleCount = 0;

                    rows.forEach(row => {
                        const text = row.querySelector(".link-name").textContent.toLowerCase();
                        const match = !q || text.includes(q) || title.includes(q);
                        row.style.display = match ? "" : "none";
                        if (match) visibleCount++;
                    });

                    group.style.display = visibleCount > 0 ? "" : "none";
                    group.querySelector(".group-count").textContent = visibleCount + (visibleCount === 1 ? " item" : " items");
                    if (visibleCount > 0) anyVisible = true;
                });

                container.setAttribute("data-has-visible", String(anyVisible));
            }

            async function loadLinks() {
                container.setAttribute("aria-busy", "true");
                container.innerHTML = "";

                try {
                    const res = await fetch(JSON_URL, { cache: "no-store" });
                    if (!res.ok) throw new Error("Failed to load links.json");
                    const data = await res.json();

                    const settings = data.settings && typeof data.settings === "object" ? data.settings : {};
                    const iconSize = Number(settings.iconSize) || 24;
                    const fontSize = Number(settings.fontSize) || 13.5;
                    applySettings(iconSize, fontSize);

                    const columns = Array.isArray(data.columns) ? data.columns : [];
                    const groups = data.groups && typeof data.groups === "object" ? data.groups : {};

                    container.style.gridTemplateColumns = `repeat(${Math.max(columns.length, 1)}, 1fr)`;

                    columns.forEach(groupNames => {
                        const col = document.createElement("div");
                        col.className = "column";

                        (groupNames || []).forEach(groupName => {
                            const items = Array.isArray(groups[groupName]) ? groups[groupName] : [];
                            col.appendChild(createGroup(groupName, items));
                        });

                        container.appendChild(col);
                    });

                    filterUI(searchInput.value || "");
                } catch (err) {
                    console.error(err);
                    container.innerHTML = `<div class="load-error">Failed to load links. Ensure links.json is present and valid.</div>`;
                } finally {
                    container.setAttribute("aria-busy", "false");
                }
            }

            searchInput.addEventListener("input", (e) => filterUI(e.target.value));
            loadLinks();
        </script>
    </body>
</html>
