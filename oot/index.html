<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zelda OOT Count Down</title>
    <meta name="description" content="A countdown to The Legend of Zelda: Ocarina of Time.">

    <meta property="og:title" content="Zelda OOT Count Down">
    <meta property="og:description" content="A countdown to The Legend of Zelda: Ocarina of Time.">
    <meta property="og:image" content="https://USER.github.io/REPO/oot/zelda.png">
    <meta property="og:type" content="website">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Zelda OOT Count Down">
    <meta name="twitter:description" content="A countdown to The Legend of Zelda: Ocarina of Time.">
    <meta name="twitter:image" content="https://USER.github.io/REPO/oot/zelda.png">

    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">

    <link rel="preload" as="video" href="./zelda_1.mp4" type="video/mp4">
    <link rel="preload" as="video" href="./zelda_2.mp4" type="video/mp4">

    <style>
        @font-face {
            font-family: 'ZeldaFont';
            src: url('./zelda.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'ZeldaFont', 'Courier New', monospace;
            color: white;
        }

        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background-color: #000;
            overflow: hidden;
        }

        .video-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            will-change: opacity;
            backface-visibility: hidden;
            transform: translateZ(0);
        }

        .aspect-ratio-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .content-wrapper {
            position: relative;
            width: 100%;
            max-width: 100vw;
            max-height: 56.25vw;
            aspect-ratio: 16 / 9;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @media (min-aspect-ratio: 16/9) {
            .content-wrapper {
                max-width: 177.78vh;
                max-height: 100vh;
            }
        }

        .countdown-container {
            text-align: center;
            z-index: 1;
        }

        .mission-name {
            font-size: 3vw;
            font-weight: normal;
            letter-spacing: 0.15em;
            margin-bottom: 1.5vw;
            text-transform: uppercase;
        }

        .countdown {
            font-size: 7vw;
            font-weight: normal;
            letter-spacing: 0.05em;
            font-variant-numeric: tabular-nums;
            margin-bottom: 1.5vw;
            font-feature-settings: "tnum";
            white-space: nowrap;
        }

        .block-info {
            font-size: 3vw;
            font-weight: normal;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        @media (min-aspect-ratio: 16/9) {
            .mission-name {
                font-size: 5.33vh;
            }
            .countdown {
                font-size: 12.44vh;
            }
            .block-info {
                font-size: 5.33vh;
            }
        }
    </style>
</head>
<body>
    <div class="video-container">
        <video class="video-background" id="video-a" muted loop="false" playsinline preload="auto" disablepictureinpicture>
            <source src="./zelda_1.mp4" type="video/mp4">
        </video>
        <video class="video-background" id="video-b" muted loop="false" playsinline preload="auto" disablepictureinpicture>
            <source src="./zelda_2.mp4" type="video/mp4">
        </video>
    </div>

    <div class="aspect-ratio-container">
        <div class="content-wrapper">
            <div class="countdown-container">
                <div class="mission-name">The Legend of Zelda</div>
                <div class="countdown" id="countdown-display">T-0:00:00:00</div>
                <div class="block-info">Ocarina Of Time</div>
            </div>
        </div>
    </div>

    <script>
        const T0 = new Date('2026-11-05T00:00:00-05:00');
        const TEXT_SHADOW_STRENGTH = 10;
        const HANDOFF_LEAD = 0.18;

        const countdownDisplay = document.getElementById('countdown-display');
        const countdownContainer = document.querySelector('.countdown-container');

        countdownContainer.style.textShadow = `0 2px ${TEXT_SHADOW_STRENGTH}px rgba(0, 0, 0, 0.5)`;

        function updateCountdown() {
            const now = new Date();
            const diff = T0 - now;

            if (diff <= 0) {
                countdownDisplay.textContent = 'T+0:00:00:00';
                return;
            }

            const totalSeconds = Math.floor(diff / 1000);
            const days = Math.floor(totalSeconds / 86400);
            const hours = Math.floor((totalSeconds % 86400) / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            const daysStr = String(days);
            const hoursStr = String(hours).padStart(2, '0');
            const minutesStr = String(minutes).padStart(2, '0');
            const secondsStr = String(seconds).padStart(2, '0');

            countdownDisplay.textContent = `T-${daysStr}:${hoursStr}:${minutesStr}:${secondsStr}`;
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);

        const videos = [document.getElementById('video-a'), document.getElementById('video-b')];
        let active = 0;
        let switching = false;

        videos.forEach(function (v) {
            v.loop = false;
            v.muted = true;
            v.defaultMuted = true;
            v.playbackRate = 1;
        });

        function safePlay(v) {
            const p = v.play();
            if (p && typeof p.catch === 'function') {
                p.catch(function () {});
            }
            return p;
        }

        function onNextFrame(v, cb) {
            if (typeof v.requestVideoFrameCallback === 'function') {
                v.requestVideoFrameCallback(function () { cb(); });
            } else {
                setTimeout(cb, 50);
            }
        }

        function whenLoaded(v) {
            return new Promise(function (resolve) {
                if (v.readyState >= 3) {
                    resolve();
                    return;
                }
                const done = function () { resolve(); };
                v.addEventListener('canplaythrough', done, { once: true });
                v.addEventListener('loadeddata', done, { once: true });
                v.load();
            });
        }

        function warmDecoder(v) {
            return new Promise(function (resolve) {
                v.style.opacity = '0';
                try { v.currentTime = 0; } catch (e) {}
                safePlay(v);
                onNextFrame(v, function () {
                    v.pause();
                    try { v.currentTime = 0; } catch (e) {}
                    resolve();
                });
            });
        }

        function beginHandoff() {
            if (switching) {
                return;
            }
            switching = true;

            const curIdx = active;
            const nxtIdx = curIdx === 0 ? 1 : 0;
            const current = videos[curIdx];
            const next = videos[nxtIdx];

            try { next.currentTime = 0; } catch (e) {}
            safePlay(next);

            onNextFrame(next, function () {
                next.style.opacity = '1';
                current.style.opacity = '0';
                active = nxtIdx;
                setTimeout(function () {
                    current.pause();
                    try { current.currentTime = 0; } catch (e) {}
                    warmDecoder(current).then(function () {
                        switching = false;
                    });
                }, 150);
            });
        }

        function tick() {
            const v = videos[active];
            if (v && !switching && isFinite(v.duration) && v.duration > 0) {
                if (v.duration - v.currentTime <= HANDOFF_LEAD) {
                    beginHandoff();
                }
            }
            requestAnimationFrame(tick);
        }

        videos.forEach(function (v) {
            v.addEventListener('ended', function () {
                if (videos[active] === v) {
                    beginHandoff();
                }
            });
        });

        document.addEventListener('visibilitychange', function () {
            if (!document.hidden) {
                safePlay(videos[active]);
            }
        });

        Promise.all(videos.map(whenLoaded))
            .then(function () {
                return warmDecoder(videos[1]);
            })
            .then(function () {
                active = 0;
                videos[0].style.opacity = '1';
                try { videos[0].currentTime = 0; } catch (e) {}
                safePlay(videos[0]);
                requestAnimationFrame(tick);
            });

        document.addEventListener('click', function () {
            safePlay(videos[active]);
        }, { once: true });
    </script>
</body>
</html>
